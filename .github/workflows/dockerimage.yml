name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
      versions:
        description: 'Versions to build (comma-separated, optional)'
        required: false
        type: string
        default: ''
      variant:
        description: 'Image variant suffix (e.g. -bundle, empty for standard)'
        required: false
        type: choice
        options:
          - ''
          - '-bundle'
        default: ''

env:
  REGISTRY_IMAGE: ${{ vars.DOCKERHUB_USER }}/valkey-cluster

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set build matrix
        id: set-matrix
        run: |
          if [ -n "${{ github.event.inputs.versions }}" ]; then
            versions=$(echo "${{ github.event.inputs.versions }}" | jq -R -s -c 'split(",") | map(gsub("^\\s+|\\s+$"; "") | select(length>0))')
          else
            versions=$(yq -o json '.versions' .github/workflows/versions | jq -c '.')
          fi
          echo "matrix={\"version\":$versions}" >> "$GITHUB_OUTPUT"

  build:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set tag suffix
        id: tag-suffix
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "suffix=-test" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ matrix.version }}${{ github.event.inputs.variant }}${{ steps.tag-suffix.outputs.suffix }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and test
        env:
          VALKEY_VERSION: ${{ matrix.version }}
          VALKEY_VARIANT: ${{ github.event.inputs.variant }}
        run: |
          cd test
          bash test.sh

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VALKEY_VERSION=${{ matrix.version }}
            VALKEY_VARIANT=${{ github.event.inputs.variant }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.version }}${{ github.event.inputs.variant }}${{ steps.tag-suffix.outputs.suffix }}
            ghcr.io/${{ env.REGISTRY_IMAGE }}:${{ matrix.version }}${{ github.event.inputs.variant }}${{ steps.tag-suffix.outputs.suffix }}
          push: true
